name: Tests

# Pull requests run the tests, so a branch must have a green run before it merges.
# A branch push runs nothing by itself: with a PR open it would only repeat the `pull_request` run.
# For a branch without a PR, use "Run workflow" and pick the branch.
# On main, a green push run also publishes the site to GitHub Pages (the `deploy` job).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Playwright's own Chromium (pinned by @playwright/test) instead of the runner's Chrome, so runs are reproducible.
  PW_CHANNEL: ''
  # Every score golden must have a Linux layout baseline; a missing one fails instead of passing quietly.
  GOLDEN_REQUIRE_PLATFORM: '1'

# Every job runs on ubuntu-24.04, pinned rather than ubuntu-latest: the Linux layout baselines were taken on this
# image, and a new image (fonts) may move them. Change it on purpose, re-taking the baselines in the same PR.
jobs:
  # Static checks, unit tests and the site build, once per run. The Playwright jobs run beside it.
  checks:
    runs-on: ubuntu-24.04
    # About 3 minutes on a normal runner.
    timeout-minutes: 10
    # The site's artifact is named per attempt, so re-running this job never leaves two copies for `deploy` to choose
    # from. A re-run of `deploy` alone, or of failed test jobs only, keeps this output and so the artifact of the
    # attempt that built it.
    outputs:
      site: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The split invariant (tests/unit/split-etude.test.mjs) compares against the immutable pre-split anchor.
          # Keep the full history so a clean CI checkout can read 32a184b:etude.html.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types node
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:i18n
      # The site GitHub Pages serves (scripts/build.mjs). Built on every run, so a broken build shows before merging.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/etude

  # The Playwright suite against the built site (both projects, `app` and `sw`), split into 3 shards.
  # Each test runs in exactly one shard.
  e2e-build:
    runs-on: ubuntu-24.04
    # About 5 minutes per shard on a normal runner.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      # Failure traces, and the score-layout results for platforms without a golden baseline yet (see tests/golden.spec.mjs).
      # A failed upload doesn't stop a green run from publishing the site.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: test-results-build-${{ matrix.shard }}-of-3-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The same suite against the Vite dev server (`npm run test:dev`, the `app` project), split into 2 shards.
  e2e-dev:
    runs-on: ubuntu-24.04
    # About 6 minutes per shard on a normal runner.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dev -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: test-results-dev-${{ matrix.shard }}-of-2-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Publishes the site built above to https://maurs9.github.io/etude/: only from main, and only once every test job
  # (the checks, every build shard and every dev-server shard) passes.
  deploy:
    needs: [checks, e2e-build, e2e-dev]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment is never cut off halfway; a newer one waits for it.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # While Settings → Pages → Source is still "Deploy from a branch", Pages publishes the branch itself too, and the
      # two would replace each other on every push. Fail instead: switch the source to "GitHub Actions", then re-run.
      - name: Check that Pages publishes from GitHub Actions
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$type" != workflow ]; then
            echo "::error::Pages publishes from a branch (build_type: $type). Set Settings → Pages → Source to \"GitHub Actions\", then re-run the failed job."
            exit 1
          fi
      # Re-running an older run must not bring back an older site, so only the newest commit on main is published.
      - name: Check that this is the newest commit on main
        id: latest
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not published: main is at $head, whose run should publish the site. If that run was cancelled or skipped, use \"Run workflow\" on main."
          fi
      - id: deployment
        if: steps.latest.outputs.ok == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.checks.outputs.site }}
