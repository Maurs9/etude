name: Tests

# Every branch, not only main: branches are often merged locally and pushed, so a branch must be green before merging.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Playwright's own Chromium (pinned by @playwright/test) instead of the runner's Chrome, so runs are reproducible.
      PW_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Failure traces, and the score-layout results for platforms without a golden baseline yet (see tests/golden.spec.mjs).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
