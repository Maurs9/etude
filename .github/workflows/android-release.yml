name: Android TWA Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version of the pushed tag (e.g. 1.0.24). Optional when running from the tag.'
        required: false
      version_code:
        description: 'Android versionCode. Defaults to the workflow run number. Must increase for every update.'
        required: false

permissions:
  contents: write

concurrency:
  group: >-
    android-release-${{
      github.ref_type == 'tag' && github.ref_name
      || startsWith(inputs.version_name, 'v') && inputs.version_name
      || format('v{0}', inputs.version_name)
    }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify release version and tag before building
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/android-release.mjs prepare

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Configure Bubblewrap paths
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;36.1.0" "platforms;android-36"
          ln -sfn "$SDK_DIR/cmdline-tools/latest/bin" "$SDK_DIR/bin"
          mkdir -p "$HOME/.bubblewrap"
          cat <<EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_DIR"
          }
          EOF
          bubblewrap doctor

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD (and optional ANDROID_KEY_ALIAS, default 'etude') in Repo Settings -> Secrets and variables -> Actions. See docs/runbooks/android-twa.md."
            exit 1
          fi

      - name: Decode signing keystore
        working-directory: android-twa
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android.keystore

      - name: Apply release version to twa-manifest.json
        working-directory: android-twa
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          node - <<'EOF'
          const fs = require('node:fs');
          const alias = process.env.KEY_ALIAS || 'etude';

          const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
          manifest.appVersionName = process.env.VERSION_NAME;
          manifest.appVersion = process.env.VERSION_NAME;
          manifest.appVersionCode = Number(process.env.VERSION_CODE);
          manifest.signingKey = { path: './android.keystore', alias };
          fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          EOF

      - name: Generate Android TWA project and build APK/AAB
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest=twa-manifest.json

      - name: Extract SHA-256 fingerprint and generate assetlinks.json
        working-directory: android-twa
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ALIAS="${KEY_ALIAS:-etude}"
          SHA256=$(keytool -list -v -keystore android.keystore -alias "$ALIAS" -storepass "$KEYSTORE_PASS" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)
          if [ -z "$SHA256" ]; then
            echo "::error::Could not extract SHA-256 fingerprint from android.keystore for alias '$ALIAS'."
            exit 1
          fi
          cat <<EOF > assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "io.github.maurs9.etude",
                "sha256_cert_fingerprints": [
                  "$SHA256"
                ]
              }
            }
          ]
          EOF
          echo "### Digital Asset Links (\`assetlinks.json\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "Host this at \`https://maurs9.github.io/.well-known/assetlinks.json\` (in repo \`Maurs9/maurs9.github.io\`):" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat assetlinks.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Stage release artifacts
        working-directory: android-twa
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
        run: |
          mkdir -p release-assets
          cp app-release-signed.apk "release-assets/etude-android-$RELEASE_TAG.apk"
          cp app-release-bundle.aab "release-assets/etude-android-$RELEASE_TAG.aab"
          cp assetlinks.json release-assets/assetlinks.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
        run: |
          node scripts/android-release.mjs verify "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Étude Android $RELEASE_TAG" \
            "android-twa/release-assets/etude-android-$RELEASE_TAG.apk" \
            "android-twa/release-assets/etude-android-$RELEASE_TAG.aab" \
            android-twa/release-assets/assetlinks.json
